<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loose Thread · hammi.ca</title>
<meta name="description" content="Loose Thread: a top-down game where you tie things up with thread instead of fighting.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: the game screen centred on a dark felt backdrop, with a thin control strip under it. */
:root {
  --bg: #0f0c16; --panel: #1d1729; --ink: #f5ecff; --muted: #a99bc2; --thread: #ff5a96; --lamp: #ffd040;
  --pixel: 'Press Start 2P', 'Courier New', monospace; --body: 'Rubik', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); margin: 0; }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 14px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
#stage { position: relative; display: flex; justify-content: center; min-width: 0; }
#game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; border: 3px solid #3a2f52; border-radius: 4px; background: #16121f; touch-action: none; max-width: 100%; }
#overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 16px; background: rgba(15,12,22,.78); pointer-events: none; }
#overlay h1, #overlay h2 { font-family: var(--pixel); margin: 0 0 6px; line-height: 1.3; }
#overlay h1 { font-size: clamp(26px, 6vw, 48px); color: var(--ink); text-shadow: 3px 3px 0 var(--thread); }
#overlay h2 { font-size: clamp(14px, 3vw, 20px); color: var(--lamp); }
#overlay p { margin: 0; max-width: 46ch; justify-self: center; color: var(--ink); }
#overlay .go { font-family: var(--pixel); font-size: 11px; color: var(--thread); margin-top: 8px; animation: blink 1s steps(2) infinite; }
#overlay .small { color: var(--muted); font-size: 13px; }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { #overlay .go { animation: none; } }
#hint { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); background: rgba(29,23,41,.92); border: 1px solid #3a2f52; color: var(--ink); padding: 6px 12px; border-radius: 4px; font-size: 14px; max-width: calc(100% - 24px); text-align: center; pointer-events: none; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 14px; }
.keys b { color: var(--ink); font-weight: 600; }
button { font: 600 13px var(--body); color: var(--ink); background: var(--panel); border: 1px solid #3a2f52; border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.home { color: var(--muted); font-size: 14px; }
.home:hover { color: var(--ink); }
button:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }
#thread-btn { display: none; font-family: var(--pixel); font-size: 12px; background: var(--thread); color: #1a0710; border: 0; padding: 18px 22px; border-radius: 50px; user-select: none; -webkit-user-select: none; touch-action: none; }
.touch-note { display: none; }
@media (pointer: coarse) { #thread-btn { display: block; } .keys { display: none; } .touch-note { display: inline; } }
</style>
</head>
<body>

<div class="wrap">
  <div id="stage">
    <canvas id="game" width="480" height="272" aria-label="Loose Thread game screen"></canvas>
    <div id="overlay"></div>
    <div id="hint" hidden></div>
  </div>
  <div class="bar">
    <span class="keys"><b>WASD / arrows</b> move · hold <b>SPACE</b> to lay thread · <b>M</b> mute</span>
    <span class="touch-note">On a phone: drag on the screen to move, hold THREAD.</span>
    <button id="thread-btn" type="button">THREAD</button>
    <a class="home" href="/">Back to hammi.ca</a>
    <button id="mute" type="button">Sound on</button>
  </div>
</div>
<script src="art-data.js"></script>
<script src="rooms.js"></script>
<script src="game.js"></script>
</body>
</html>
